# Push a tag like v1.0.0 to build and publish binaries to GitHub Releases.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%%/*}"
            GOARCH="${target##*/}"
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            out="dist/dnscheck-tui_${VERSION}_${GOOS}_${GOARCH}${ext}"
            echo "Building ${out}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/dnscheck-tui
          done
          (cd dist && sha256sum dnscheck-tui_* > checksums.txt)

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "dnscheck-tui ${GITHUB_REF_NAME}" \
            --generate-notes
